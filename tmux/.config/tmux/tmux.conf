# ============================================================
# Terminal
# ============================================================

set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",alacritty:RGB"

set -g mouse on
set -g allow-passthrough on

# Increase scrollback history
set -g history-limit 100000

# Reduce delay when pressing Escape
set -sg escape-time 10


# ============================================================
# Prefix
# ============================================================

# Change prefix from Ctrl+b to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload tmux configuration with Ctrl+a, r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"


# ============================================================
# Windows and panes
# ============================================================

# Start window and pane numbering at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Automatically reorder window numbers
set-option -g renumber-windows on

# Open new windows in the current directory
bind c new-window -c "#{pane_current_path}"

# Split panes in the current directory
unbind '"'
unbind %

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"


# ============================================================
# Pane navigation
# ============================================================

# Vim-style pane navigation using Ctrl+a, then h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + arrow keys to switch panes without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D


# ============================================================
# Window navigation
# ============================================================

# Shift + arrow keys to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Alt + Shift + h/l to switch windows
bind -n M-H previous-window
bind -n M-L next-window


# ============================================================
# Pane resizing
# ============================================================

# Ctrl+a, then Shift+h/j/k/l
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5


# ============================================================
# Copy mode
# ============================================================

set-window-option -g mode-keys vi

# Enter copy mode with Ctrl+a, [
bind-key [ copy-mode

# Vim-style copy-mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel


# ============================================================
# Status bar and theme
# ============================================================

set -g status-position top
set -g status-interval 5

# Catppuccin configuration
set -g @catppuccin_flavour "mocha"

# Tokyo Night configuration
set -g @tokyo-night-tmux_show_datetime 0
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format relative
set -g @tokyo-night-tmux_window_id_style dsquare
set -g @tokyo-night-tmux_show_git 0


# ============================================================
# Session save and restore
# ============================================================

# Restore saved sessions when tmux starts
set -g @continuum-restore "on"

# Save sessions every 5 minutes
set -g @continuum-save-interval "5"

# Restore programs supported by tmux-resurrect
set -g @resurrect-processes "ssh vim nvim man less more tail top htop btop npm pnpm yarn node python python3"


# ============================================================
# Plugins
# ============================================================

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "dreamsofcode-io/catppuccin-tmux"

# Session persistence
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"


# ============================================================
# TPM must remain at the bottom
# ============================================================

run "~/.config/tmux/plugins/tpm/tpm"
