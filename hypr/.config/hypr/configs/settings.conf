# ~/.config/hypr/configs/settings.conf

#############################
### ENVIRONMENT VARIABLES ###
#############################
### Cursor sizes
# env = XCURSOR_SIZE,24
# env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,macOS
env = XCURSOR_SIZE,24
### Force Wayland for GTK apps
env = GDK_BACKEND,wayland

### Force Wayland for QT apps
env = QT_QPA_PLATFORM,wayland

### Firefox Wayland
env = MOZ_ENABLE_WAYLAND,1

### Required for portals
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland#####################
### LOOK AND FEEL ###
#####################

general { 
    gaps_in = 2
    gaps_out = 2
    border_size = 0
    allow_tearing = false
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
    active_opacity = 1
    inactive_opacity = 1
}

animations {
    enabled = false
}
dwindle {
    pseudotile = true 
    preserve_split = true 
}

master {
    new_status = master
}
xwayland {
    force_zero_scaling = true
}
cursor {
    no_hardware_cursors = 1
}


misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
    vfr = true  # <--- VERY IMPORTANT
}
#############
### INPUT ###
#############
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0 

    touchpad {
        natural_scroll = true 
    }
}

gesture = 3, horizontal, workspace
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
