general {
    lock_cmd = pidof hyprlock || hyprlock       # What command to run to lock
    before_sleep_cmd = loginctl lock-session    # Lock before suspending (closing lid)
    after_sleep_cmd = hyprctl dispatch dpms on  # Turn screen on when waking up
}

listener {
    timeout = 300                                # 5 minutes
    on-timeout = loginctl lock-session           # Lock screen
}

listener {
    timeout = 360                                # 5.5 minutes
    on-timeout = hyprctl dispatch dpms off       # Turn off monitor to save power
    on-resume = hyprctl dispatch dpms on         # Turn monitor back on when activity is detected
}
